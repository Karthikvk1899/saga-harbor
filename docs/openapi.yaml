openapi: 3.1.0
info:
  title: Saga Harbor API
  version: 0.1.0
  description: Coordinator state is not proof of downstream effects.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/sagas:
    post:
      summary: Start or replay an idempotent checkout saga
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
      responses:
        '201': {description: New saga, content: {application/json: {schema: {$ref: '#/components/schemas/Started'}}}}
        '200': {description: Existing saga for this idempotency key and order, content: {application/json: {schema: {$ref: '#/components/schemas/Started'}}}}
        '400': {description: Invalid input or missing required header}
        '401': {description: Missing or invalid bearer key}
        '409': {description: Idempotency key belongs to another order}
        '503': {description: Outbox at capacity}
  /api/v1/sagas/{id}:
    get:
      summary: Read current coordinator state
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current saga, content: {application/json: {schema: {$ref: '#/components/schemas/Saga'}}}}
        '401': {description: Missing or invalid bearer key}
        '404': {description: Unknown saga}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Started:
      type: object
      required: [id, state, created]
      properties:
        id: {type: string, format: uuid}
        state: {type: string}
        created: {type: boolean}
    Saga:
      type: object
      required: [id, orderId, state, commandId, version, createdAtMs, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string}
        state:
          type: string
          enum: [RESERVING, CHARGING, RELEASING, COMPLETED, COMPENSATED, FAILED, MANUAL_REVIEW]
        commandId: {type: string, description: Empty string in terminal states}
        version: {type: string, description: Redis hash value encoded as a string}
        createdAtMs: {type: string, description: Redis server epoch milliseconds encoded as a string}
        updatedAtMs: {type: string, description: Redis server epoch milliseconds encoded as a string}
