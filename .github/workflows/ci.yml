name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        env:
          SAGA_API_KEY: local-integration-key-long-enough-123
        run: docker compose up --build -d
      - name: Drive Kafka compensation workflow
        env:
          SAGA_API_KEY: local-integration-key-long-enough-123
        run: bash scripts/e2e.sh
      - name: Concurrent admission smoke
        env:
          SAGA_API_KEY: local-integration-key-long-enough-123
        run: python3 scripts/load.py --count 200 --workers 20
      - name: Container logs
        if: failure()
        env:
          SAGA_API_KEY: local-integration-key-long-enough-123
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        env:
          SAGA_API_KEY: local-integration-key-long-enough-123
        run: docker compose down -v
